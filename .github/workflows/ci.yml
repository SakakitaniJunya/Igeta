name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # prepare スクリプトが走るのでここで dist/ が build される
      - run: npm ci
      - name: 機密混入
        run: npm run secret-scan
      - name: 型検査
        run: npx tsc --noEmit
      - name: 検査コードの自己テスト
        run: npm run test:scripts
      - name: Markdown 記法
        run: npm run docs:lint
      - name: 索引・参照整合性
        run: npm run docs:check
      - name: テンプレ適合
        run: npm run docs:template-check
